<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>

    <style>
        table {
            border-collapse: collapse;
            margin: 30px auto;
            font-family: "Times New Roman", serif;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Day/Time</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>12:00 - 1:00</th>
            <th>1:00 - 2:00</th>
            <th>2:00 - 3:00</th>
            <th>3:00 - 4:00</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td rowspan="2">Mathematics</td>
            <td>English</td>
            <td>Physics</td>
            <td>Break</td>
            <td>C Programming</td>
            <td>Computer Lab</td>
            <td>Sports</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>C Programming</td>
            <td>Break</td>
            <td colspan="2">Electrical Engineering</td>
            <td>Library</td>
            <td>English</td>
        </tr>
    </table>

</body>
</html>
